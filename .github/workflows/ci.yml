name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    # Needs a runner image with Xcode that ships the iOS 27.2 / macOS 27 SDKs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test packages on macOS
        run: |
          set -e
          for pkg in Packages/*/; do
            echo "::group::$pkg"
            swift test --package-path "$pkg"
            echo "::endgroup::"
          done

  apps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build iOS app (simulator, unsigned)
        run: xcodebuild build -project Kage.xcodeproj -scheme KageiOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build macOS app (unsigned)
        run: xcodebuild build -project Kage.xcodeproj -scheme KageMac -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
