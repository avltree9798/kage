name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    # Needs a runner image with Xcode that ships the iOS 27.2 / macOS 27 SDKs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test packages on macOS
        run: |
          set -e
          for pkg in Packages/*/; do
            echo "::group::$pkg"
            swift test --package-path "$pkg"
            echo "::endgroup::"
          done
      - name: Build AppShell for iOS Simulator
        working-directory: Packages/AppShell
        run: xcodebuild build -scheme AppShell -destination 'generic/platform=iOS Simulator' -quiet
